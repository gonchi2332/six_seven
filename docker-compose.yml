services:
  db:
    image: postgres:15-alpine
    container_name: sixseven_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build: ./backend
    container_name: sixseven_backend
    env_file:
      - .env
    ports:
      - "3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: sixseven_frontend
    ports:
      - "80"
    depends_on:
      - backend

volumes:
  pgdata:
